# /etc/locale.conf - the locale a login shell starts in.
#
# One NAME=value per line. /etc/profile.d/locale.sh exports what it finds here
# into every login shell, leaving alone anything the environment already
# carries - so a value forwarded over SSH wins over this file, which is what
# AcceptEnv in sshd_config is for.
#
# LANG is the default for every category. An individual category overrides it
# for itself (LC_TIME=en_GB.UTF-8 beside LANG=pl_PL.UTF-8 is a Polish system
# that writes dates the British way), and LC_ALL overrides all of them at once -
# which is a blunt instrument, better left to scripts that need a fixed locale.
#
# The locale named here has to be one that has been compiled: see locale.conf(5)
# and locale-gen(8), and "locale -a" for what this machine has. Naming one that
# has not been compiled makes every program print a setlocale warning and fall
# back to C.
#
# C.UTF-8 is the shipped default. It is the C locale - code-point collation,
# unambiguous dates, English messages - with the character set corrected to
# UTF-8, so the image is right about text without deciding anybody's language.
# Change it to the locale of whoever runs the machine:
#
#     locale-gen de_DE.UTF-8
#     printf 'LANG=de_DE.UTF-8\n' > /etc/locale.conf
#
LANG=C.UTF-8
