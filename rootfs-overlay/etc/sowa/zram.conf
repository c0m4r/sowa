# Configuration for the zram service - /etc/rc.d/init.d/zram.
#
# zram is a block device that keeps what is written to it compressed in memory.
# Used as swap it gives the machine somewhere to push cold anonymous pages
# without a disk: the pages never leave RAM, they just stop taking a page each.
# On the live medium, whose root is a tmpfs and whose disk may be a read-only
# ISO, it is the difference between a session that runs out of memory and one
# that carries on.
#
# The init script sources this file as shell, so each setting is an ordinary
# assignment and anything after a "#" is a comment. "service zram restart"
# applies a change to the running system; "chkconfig zram off" stops it
# happening at the next boot.
#
# See zram.conf(5) for the same thing at more length, and
# /root/sowa-howto/zram.txt for what to look at once it is running.

# How much uncompressed data the device will accept, as a percentage of this
# machine's memory or as a size with a suffix ("2G", "512M", "1GiB").
#
# It is a ceiling, not a reservation. An empty zram device occupies nothing and
# a full one occupies whatever its contents compressed to, so 50% of memory
# costs something closer to a sixth of it once real anonymous pages are in
# there. That is also why going above 100% is a legitimate thing to do - and
# why it is the interesting way to run a machine out of memory.
ZRAM_SIZE=50%

# The compressor. This kernel is built with zstd, which is the default, and
# with lzo and lzo-rle. "zramctl" reports what the device ended up using and
# /sys/block/zram0/comp_algorithm lists everything it could have.
ZRAM_ALGORITHM=zstd

# Swap priority; higher is used first. 100 is above anything an /etc/fstab
# entry would give a disk, so a machine with both fills memory-backed swap
# before it spills onto the disk - which is the only ordering worth having.
ZRAM_PRIORITY=100

# How readily the kernel swaps at all, 0 to 200. The default of 60 is written
# for a device with a seek time; swapping here costs a compression instead, so
# a higher number is the honest setting once the swap is zram. The service
# records the value it found and puts it back when it stops.
#
# Leave this empty to let the kernel's own setting stand.
ZRAM_SWAPPINESS=100
