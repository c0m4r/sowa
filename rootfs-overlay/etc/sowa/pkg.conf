# Configuration for sowa-pkg(8).
#
# This file is data, not shell. sowa-pkg reads it line by line: KEY=VALUE, with
# at most one layer of quotes, one of the five settings below, and a value that
# matches what that setting is allowed to be. Anything else - an unknown key, a
# key set twice, a value containing $, a backquote, a backslash or a space - is
# refused rather than guessed at, and nothing in here is ever executed.
#
# That matters because of "sowa-pkg --root DIR", which reads DIR's copy of this
# file while running on the host: an image being repaired, a disk that came from
# somewhere else, a container root somebody handed over. Reading it as data is
# what keeps repairing such a tree from running its configuration file as root.
#
# The repository is a plain directory served over HTTPS: an index, its
# signature, and the package archives. Nothing is required of the server beyond
# handing those files back, and this URL is the only place the location is
# recorded.
#
SOWA_REPO_URL="https://sowa.wolfet.pl/x86_64"

# Packages built for another architecture are refused at update time.
SOWA_REPO_ARCH="x86_64"

# The Ed25519 public key the index must be signed with. Its private half never
# leaves the machine that publishes the repository.
SOWA_REPO_KEY="/etc/sowa/keys/sowa-repo.pub"

# Accepting an unsigned index means trusting whoever can answer for the URL
# above - and on a self-hosted repository that is the whole of the trust. The
# signature is what makes a compromised or impersonated server unable to ship
# code to this machine. Leave this at 1 unless you are serving a repository you
# built and cannot sign.
#
# The signature says who wrote the index; it does not say that this is the
# newest index they wrote. That is what the serial and expiry inside the signed
# index are for, and sowa-pkg refuses one that has gone backwards or run out
# unless it is told --allow-stale.
SOWA_REQUIRE_SIGNATURE=1

# Whether to take the steps packages declare: stopping a daemon before its
# program is removed, restarting one an upgrade has replaced, and running the
# setup a package needs before it works at all. "sowa-pkg hooks" prints every
# one of them, and none is arbitrary code - sowa-pkg implements the actions
# itself, and the only program a package can ask it to run is one from the same
# archive the index pinned.
#
# Setting this to 0 makes every install and removal purely a matter of files,
# which is what a machine that manages its own services wants. It also means
# removing a package leaves its daemon running.
SOWA_RUN_HOOKS=1
