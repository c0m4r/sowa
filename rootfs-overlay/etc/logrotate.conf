# Sowa's log rotation policy.
#
# Everything this machine writes to /var/log only ever grows: the rc framework
# appends each service's output to /var/log/<name>.log, syslog-ng writes the
# files named in /etc/syslog-ng/syslog-ng.conf, and sowa-pkg records every
# transaction in /var/log/sowa-pkg.log. A root filesystem that fills up does
# not announce itself - it stops being writable, and then every other failure
# on the machine looks like the same failure.
#
# What is here are the defaults; the rules for this system's own logs are in
# /etc/logrotate.d/sowa, and a package or an administrator adds a file beside
# it. logrotate runs daily from /etc/cron.d/logrotate.

# Weekly, keeping four - a month of history, which is long enough to answer
# "when did this start" and short enough not to be the reason the disk fills.
weekly
rotate 4

# A rotated log is created again immediately so that a daemon holding the old
# inode is not writing into a file nothing can find. This mode matches
# syslog-ng's destinations; rules using copytruncate preserve the original file
# and its existing mode instead of creating a replacement.
create 0640 root root

# The date rather than a number in the name: messages.20260819 says when it
# was, where messages.3 only says how many have happened since.
dateext
dateformat -%Y%m%d

# Compressed, but not the newest one: the most recent rotation is the one
# somebody is most likely to want to grep, and gzip's saving on it is paid for
# every time it is read.
compress
delaycompress
notifempty

# A log a package removed is not an error, and a directory in
# /etc/logrotate.d that has nothing in it yet is not one either.
missingok

include /etc/logrotate.d
