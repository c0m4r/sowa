@version: 4.12
#
# Sowa's system logger.
#
# This file answers one question: where does everything that calls syslog(3)
# end up. Before syslog-ng was in the image the answer was nowhere - /dev/log
# had no listener, so sshd's authentication records, su and sudo, crond's
# account of what it ran, and anything installed from the repository afterwards
# all wrote into a socket nothing read.
#
# It does *not* replace the per-service log files. The rc framework starts each
# daemon in the foreground and appends its standard output and standard error
# to /var/log/<name>.log, and that stays exactly as it was: a service that
# cannot start has to be able to say so without depending on the logger, and
# some of them - chronyd, named - are configured to talk on stderr on purpose.
# What is here is the other half.
#
# The destinations follow the names a Unix administrator already knows, so that
# what "tail /var/log/secure" does on this machine is what it does on any other.

options {
    # Where messages come from is what the sender said, not what the socket
    # implies, and a relayed message keeps the name of the machine it started
    # on rather than gaining this one's.
    keep_hostname(yes);
    chain_hostnames(off);
    # Written through on each message. A logger that batched would lose the
    # last few seconds of a machine that is about to stop being able to write
    # anything - which is the case the log is being read for.
    flush_lines(0);
    # A log names the paths, users and addresses of a machine. Nothing on this
    # system needs to read that but root.
    perm(0640);
    dir_perm(0750);
    create_dirs(yes);
    # Two identical messages a second apart are two events; a thousand are a
    # loop, and the summary line is more useful than the thousandth copy.
    suppress(30);
    stats(freq(0));
};

# Everything on the machine that speaks syslog. internal() is syslog-ng's own
# voice - the messages it would otherwise have nowhere to put once it is past
# the start-up that --stderr covers.
source s_system {
    unix-dgram("/dev/log");
    internal();
};

# The kernel ring buffer. dmesg reads it through /dev/kmsg and is unaffected;
# this is the copy that persists across a reboot, which is where an oops or a
# disk error is looked for afterwards. syslog-ng is the only reader of
# /proc/kmsg on this system.
#
# It goes into /var/log/messages rather than a kern.log of its own. That is
# what the System V tradition this image follows does, and it also keeps every
# file syslog-ng writes out of the /var/log/*.log pattern that
# /etc/logrotate.d/sowa rotates by truncation - logrotate refuses a log named
# by two rules, and these want the other treatment.
source s_kernel {
    file("/proc/kmsg" program-override("kernel"));
};

destination d_messages { file("/var/log/messages"); };
destination d_secure   { file("/var/log/secure"); };
destination d_cron     { file("/var/log/cron"); };
destination d_maillog  { file("/var/log/maillog"); };
# Anything at emerg goes to every terminal that is open, because by definition
# nobody is going to be reading a file in time.
destination d_console  { usertty("root"); };

filter f_auth    { facility(auth, authpriv); };
filter f_cron    { facility(cron); };
filter f_mail    { facility(mail); };
filter f_emerg   { level(emerg); };
# What is left: everything except the three that have a file of their own, and
# above debug, which is off unless something is being investigated.
filter f_messages {
    level(info..emerg) and not facility(auth, authpriv, cron, mail);
};

log { source(s_system); filter(f_auth);     destination(d_secure);   };
log { source(s_system); filter(f_cron);     destination(d_cron);     };
log { source(s_system); filter(f_mail);     destination(d_maillog);  };
log { source(s_system); filter(f_messages); destination(d_messages); };
log { source(s_system); filter(f_emerg);    destination(d_console);  };
log { source(s_kernel); destination(d_messages); };

# Sending these somewhere else is two lines, and is why syslog-ng is the daemon
# here rather than a smaller one. Uncomment, put the collector's name in, and
# reload; the TLS transport is built in.
#
#   destination d_remote {
#       syslog("logs.example.org" transport("tls") port(6514)
#           tls(ca-dir("/etc/ssl/certs")));
#   };
#   log { source(s_system); source(s_kernel); destination(d_remote); };
