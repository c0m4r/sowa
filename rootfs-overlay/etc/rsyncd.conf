# rsyncd is disabled by default. Local copies and transfers over SSH do not
# need it. See rsyncd.conf(5) before enabling a module and remote access.
address = 127.0.0.1
port = 873
uid = nobody
gid = nobody
use chroot = yes
read only = yes
max connections = 4
lock file = /run/rsyncd.lock
log file = /var/log/rsyncd.log

# No directories are exported by default. To offer a read-only module, create
# a directory readable by nobody, then uncomment and adjust this example:
# [files]
#     path = /srv/rsync
#     comment = Shared files
