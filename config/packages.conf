# The binary packages Sowa publishes, in dependency order.
#
# name|source|release|depends|profile|description
#
#   name        package name, also the name of the archive and of the local
#               database entry
#   source      config/sources.lock entry the version is taken from, or "-" for
#               a package versioned by DISTRO_VERSION
#   release     human-readable packaging revision; bump it when rebuilding an
#               unchanged upstream version. The machine-derived pkgbuild still
#               makes a forgotten bump converge on installed systems.
#   depends     comma-separated package names, or "-"
#   profile     "image" for a package the image is made of, "optional" for one
#               that is built and published but never shipped in the image; an
#               optional package is packaged from its own staging tree and is
#               installed only when someone asks for it by name
#   description one line, no "|"
#
# Every path in the image belongs to exactly one of the "image" packages. Files
# no component stage installs - the glibc runtime, libgcc_s.so.1,
# libstdc++.so.6, the development headers, and the base directory layout - fall
# to sowa-base, so the union of those packages always reproduces the shipped
# root filesystem.
sowa-base|glibc|3|-|image|glibc runtime, libgcc_s.so.1, libstdc++.so.6, base filesystem layout, and development headers
