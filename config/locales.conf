# The locales the image is built with.
#
# One per line, "<name> <charset>", named exactly as glibc's
# localedata/SUPPORTED names them - which is the catalogue stage
# packages/locales checks this file against, so a typo fails the build rather
# than producing an image that quietly has no such locale.
#
# The stage installs the whole catalogue into the image as /etc/locale.gen with
# these lines uncommented, and compiles exactly these into
# /usr/lib/locale/locale-archive. Nothing about that is final: the locale
# sources, the charmaps and localedef are all in the image, so "locale-gen
# pl_PL.UTF-8" on a running machine needs no network and no repository. What is
# listed here is only what the image arrives with.
#
# The cost is image size, and it is not linear: the first locale carries the
# character tables every other one shares, and each one after it adds its own
# collation and formats. C.UTF-8 alone is 392 KB, with en_US.UTF-8 beside it
# 2.9 MB, and all 328 UTF-8 locales glibc supports would be about 200 MB.
#
# C.UTF-8 is the default LANG in /etc/locale.conf and is what makes this image
# UTF-8 at all. Without a compiled locale every program falls back to C, which
# is ASCII: man pages render as -Tascii, ls quotes any file name that is not
# ASCII, and a UTF-8 terminal is being talked to in a character set the C
# library does not admit to. C.UTF-8 fixes the character set without deciding
# anybody's language - it sorts by code point and formats dates the way the C
# locale does.
#
# en_US.UTF-8 is the locale most software assumes when it wants a real one, and
# is the difference between dictionary collation and byte order.
C.UTF-8 UTF-8
en_US.UTF-8 UTF-8
