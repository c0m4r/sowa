# kind|match|replacement
#
# A prefix rule replaces the matching beginning of a locked URL. A source rule
# names one sources.lock entry and gives its complete alternate URL. Rules are
# tried in file order after the primary URL; the SHA-256 in sources.lock remains
# authoritative regardless of which server answers.

# kernel.org's GNU mirror is a direct, independently operated fallback for ICM.
# GNU's geo-aware redirector and the project's own server follow it.
prefix|https://ftp.icm.edu.pl/packages/gnu/|https://mirrors.kernel.org/gnu/
prefix|https://ftp.icm.edu.pl/packages/gnu/|https://ftpmirror.gnu.org/
prefix|https://ftp.icm.edu.pl/packages/gnu/|https://ftp.gnu.org/gnu/

# kernel.org's CDN and its canonical download host carry the same archive tree.
prefix|https://cdn.kernel.org/pub/|https://mirrors.edge.kernel.org/pub/
prefix|https://cdn.kernel.org/pub/|https://www.kernel.org/pub/
prefix|https://www.kernel.org/pub/|https://cdn.kernel.org/pub/

# deb.debian.org is already a redirector, but the canonical FTP hostname is a
# useful independent route when the redirector itself cannot be reached.
prefix|https://deb.debian.org/debian/|https://ftp.debian.org/debian/
