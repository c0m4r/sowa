# The licence of every package Sowa publishes, and where its text comes from.
#
# name|copyright|license|files
#
#   name        package name, exactly as in config/packages.conf
#   copyright   "sowa" for something this repository is the author of, which is
#               GPL-3.0-or-later like the build system around it, or "upstream"
#               for someone else's work that Sowa only compiles and packages.
#               sowa-license prints the two groups apart, so that a person on an
#               installed system can tell which of it is ours
#   license     an SPDX licence expression covering everything the package
#               installs. Where a package carries files under several licences
#               the expression is an AND of them, because that is what a
#               distribution has to honour: all of them apply, to different
#               files. An OR is a genuine choice the licensor offers
#   files       comma-separated list of the licence texts the package installs
#               into /usr/share/licenses/<name>/, each written as
#
#                   <origin>:<path>[=<name>]
#
#               <origin> is a config/sources.lock entry and <path> is relative
#               to the tree that source unpacks to, or the literal "sowa" for a
#               path relative to this repository. The optional "=<name>" renames
#               the installed copy, and is what two sources that both ship a
#               COPYING.LIB need in order to be installed side by side; without
#               it the installed name is the file's own basename.
#
# Every package in config/packages.conf appears here exactly once and names at
# least one file. "make check" refuses a table that does not, and the build
# refuses a package whose licence directory would come out empty - so a package
# added without a licence fails before it can be published.
#
# A source that is compiled *into* another package rather than shipped on its
# own is listed against the package that carries it: PCRE2 is linked statically
# into both git and nginx, and the GnuPG package is eight upstream tarballs
# installed into one staging tree.
