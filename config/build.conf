# Initial supported port. More ports should override TARGET, KARCH, KERNEL_IMAGE,
# GOARCH, and the kernel fragment together.
DISTRO_NAME=${DISTRO_NAME:-sowa}
DISTRO_VERSION=${DISTRO_VERSION:-0.1}
TARGET=${TARGET:-x86_64-sowa-linux-gnu}
KARCH=${KARCH:-x86}
KERNEL_IMAGE=${KERNEL_IMAGE:-arch/x86/boot/bzImage}
GOARCH=${GOARCH:-amd64}

# Show the running stage in the terminal title. Set to 0 to leave it alone.
TERM_TITLE=${TERM_TITLE:-1}

# The video mode the ISO's GRUB asks for and hands to Linux. It is a list, tried
# in order, so a display that cannot do the first entry falls back rather than
# failing; "auto" at the end is GRUB's own preferred mode. This sets the size of
# the framebuffer console on the local display - at the 8x16 console font,
# 1920x1080 is a 240x67 text screen against the 128x48 of the 1024x768 default.
ISO_GFXMODE=${ISO_GFXMODE:-1920x1080,1280x1024,1024x768,auto}

# How the live medium's root filesystem is compressed. The live system reads it
# through a loop device for as long as it runs, so this is a trade between the
# size of the medium and the speed of everything done from it.
#
# xz with the x86 BCJ filter and 1 MiB blocks is the default because it produces
# the smallest image, at the cost of the slowest decompression - which is paid
# on every read that misses the page cache, and is therefore paid hardest on
# machines that cannot copy the image to RAM. SFS_COMPRESSOR=zstd is the other
# sensible answer, roughly a tenth larger and several times faster to read; the
# kernel can mount either (CONFIG_SQUASHFS_XZ and CONFIG_SQUASHFS_ZSTD are both
# on).
SFS_COMPRESSOR=${SFS_COMPRESSOR:-xz}
SFS_BLOCK_SIZE=${SFS_BLOCK_SIZE:-1M}

# Parallelism and reproducible timestamps may be overridden in the environment.
JOBS=${JOBS:-auto}
SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH:-1785715200}

# The minimum kernel ABI accepted by glibc. This is intentionally older than
# the shipped kernel so the resulting userspace remains usable with 6.x kernels.
GLIBC_MIN_KERNEL=${GLIBC_MIN_KERNEL:-6.1.0}

# Binary package repository. 'make publish-repo' assembles it under DIST_DIR as
# a plain directory of files - an index, its signature, and the archives - which
# is all a web server has to expose. The URL it ends up at is not a build-time
# setting: it lives in /etc/sowa/pkg.conf, the one place the client reads it.
PKG_ARCH=${PKG_ARCH:-${TARGET%%-*}}
# Release artifacts identify the userspace ABI, not Linux's internal ARCH value.
# Keep KARCH=x86 above for kernel builds; its x86_64 userspace is labeled here.
ARTIFACT_ARCH=${ARTIFACT_ARCH:-${PKG_ARCH}}
DIST_DIR=${DIST_DIR:-${PROJECT_ROOT}/dist}

# The Ed25519 key that signs the repository index. It is deliberately outside
# the checkout: only its public half belongs in the image, where it is shipped
# by the overlay. 'make repo-key' creates the pair.
REPO_KEY=${REPO_KEY:-${HOME}/.config/sowa/repo-ed25519.key}
REPO_PUBLIC_KEY=${REPO_PUBLIC_KEY:-${PROJECT_ROOT}/rootfs-overlay/etc/sowa/keys/sowa-repo.pub}

# How long an installed system may go on believing a repository index it has no
# way to replace.
#
# The index carries a serial and an expiry inside the bytes the signature
# covers, and a client refuses one whose serial has gone backwards or whose
# expiry has passed. That is what stops a network, a stale mirror or a
# taken-over server from holding a machine at an old release by replaying
# metadata that all still verifies: every signature checks out, every checksum
# matches, and the machine simply never hears about the fix.
#
# The cost is that the repository has to be republished before this runs out,
# or every machine reading it stops updating until it is. Ninety days trades
# that against the length of the replay window; a repository published more
# often should shorten it.
REPO_INDEX_VALIDITY_DAYS=${REPO_INDEX_VALIDITY_DAYS:-90}

# The serial is the moment of publication, and is deliberately the one part of a
# package build that is not derived from SOURCE_DATE_EPOCH: an index that always
# claimed the same publication time would be indistinguishable from the one
# before it, which is exactly the property being defended against. Set this to
# give a republished index a serial of its own.
REPO_INDEX_SERIAL=${REPO_INDEX_SERIAL:-}
